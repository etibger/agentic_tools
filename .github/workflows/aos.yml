name: AOS regressions
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --dev --python 3.12.14
      - run: uv run aos version
      - run: uv run pytest --junitxml=reports/aos.xml
      - run: node scripts/check_dashboard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aos-macos-test-results
          path: reports/aos.xml
          if-no-files-found: warn
          retention-days: 30
