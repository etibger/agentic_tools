<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc">
<title id="title">Coordinator and specialist communication</title><desc id="desc">The user approves the feature and DI. The coordinator dispatches one implementer and three independent assessors, owns the acceptance join and next handoff. Dashboard and Journalist receive evidence-backed events.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1100" height="530" rx="24" fill="#f1f5f9"/>
<g font-family="system-ui, sans-serif" fill="#0f172a" text-anchor="middle">
<text x="550" y="35" font-size="21" font-weight="700">One coordinator owns the handoffs and the acceptance join</text>
<g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" fill="none">
<path d="M550 114 L550 158"/><path d="M430 199 L220 199 L220 258"/><path d="M480 230 L430 258"/><path d="M550 230 L650 258"/><path d="M620 230 L860 258"/>
<path d="M220 340 L220 370 L500 370 L500 420"/><path d="M430 340 L430 389 L540 389 L540 420"/><path d="M650 340 L650 389 L580 389 L580 420"/><path d="M860 340 L860 370 L620 370 L620 420"/>
<path d="M430 199 L145 199 L145 158"/><path d="M670 199 L955 199 L955 158"/>
</g>
<rect x="405" y="60" width="290" height="54" rx="12" fill="#dbeafe"/><text x="550" y="83" font-size="18" font-weight="700">🙋 Feature owner</text><text x="550" y="103" font-size="12">Brief • DI approval • material decisions</text>
<rect x="415" y="158" width="270" height="72" rx="12" fill="#c7d2fe"/><text x="550" y="185" font-size="20" font-weight="700">🧭 Coordinator</text><text x="550" y="209" font-size="13">Dispatch ↔ reports ↔ acknowledged next action</text>
<rect x="25" y="80" width="240" height="78" rx="12" fill="#ccfbf1"/><text x="145" y="106" font-size="18" font-weight="700">📊 Dashboard</text><text x="145" y="128" font-size="13">Actual states • clocks • usage</text><text x="145" y="147" font-size="12">Verified events, no product signoff</text>
<rect x="835" y="80" width="240" height="78" rx="12" fill="#fce7f3"/><text x="955" y="106" font-size="18" font-weight="700">✍️ Journalist</text><text x="955" y="128" font-size="13">Story • attribution • retrospective</text><text x="955" y="147" font-size="12">Durable evidence and actual exchanges</text>
<rect x="120" y="258" width="200" height="82" rx="12" fill="#ffedd5"/><text x="220" y="285" font-size="17" font-weight="700">🔨 Implementer</text><text x="220" y="307" font-size="13">One source + repo-doc writer</text><text x="220" y="326" font-size="12">Freeze exact candidate, then hold</text>
<rect x="335" y="258" width="190" height="82" rx="12" fill="#dcfce7"/><text x="430" y="285" font-size="17" font-weight="700">✅ Verification</text><text x="430" y="307" font-size="13">Executed evidence</text><text x="430" y="326" font-size="12">Owns shared native lane</text>
<rect x="555" y="258" width="190" height="82" rx="12" fill="#e0f2fe"/><text x="650" y="285" font-size="17" font-weight="700">💬 Reviewer</text><text x="650" y="307" font-size="13">Read-only source assessment</text><text x="650" y="326" font-size="12">Independent initial report</text>
<rect x="765" y="258" width="190" height="82" rx="12" fill="#fef3c7"/><text x="860" y="285" font-size="17" font-weight="700">⚡ Devil's Advocate</text><text x="860" y="307" font-size="13">Boundary counterexamples</text><text x="860" y="326" font-size="12">Independent initial criticism</text>
<rect x="350" y="420" width="400" height="70" rx="12" fill="#0f766e"/><text x="550" y="446" font-size="18" font-weight="700" fill="white">Discuss evidence → resolve → accept or correct</text><text x="550" y="472" font-size="14" fill="white">Release resources; acknowledge the next assignment</text>
<text x="550" y="512" font-size="12">🔎 Investigator prepares source trace, DI and ordered gates before implementation. Assessors overlap on the SAME frozen state.</text>
</g></svg>