[project]
name = "agentic-tools"
version = "0.1.0"
description = "Evidence-led multi-agent software development workflow templates"
requires-python = ">=3.12"
dependencies = [
    "mcp==1.26.0",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "openai-codex==0.163.0",
]

[project.scripts]
aos = "agentic_tools.aos.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
