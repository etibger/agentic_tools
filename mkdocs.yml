site_name: Agentic Tools
site_url: https://etibger.github.io/agentic_tools/
site_description: Evidence-led workflows for bug fixes, feature changes and new products
repo_url: https://github.com/etibger/agentic_tools
repo_name: etibger/agentic_tools
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  font: false
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.details
extra_css:
  - stylesheets/extra.css
hooks:
  - scripts/docs_hooks.py
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - Start here: index.md
  - Choose a workflow: quick-start.md
  - Toolbox specification: toolbox.md
  - AOS concept and approval: aos-concept.md
  - AOS coordinator commands: aos-operator.md
  - AOS reproduction and qualification: aos-validation.md
  - Worked examples: worked-examples.md
  - Extended feature workflow:
      - Quick start: extended-feature-start.md
      - Roles and communication: roles.md
      - Design and approval: design.md
      - Implementation and specification: implementation.md
      - Candidates and gates: gates.md
      - Verification and resources: verification.md
      - Dashboard and usage: dashboard.md
      - Retrospective and lessons: lessons.md
  - Future improvements: future-improvements.md
  - Download the templates: templates.md
  - Delivery and publication: reference.md
