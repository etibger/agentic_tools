site_name: Agentic Tools
site_url: https://etibger.github.io/agentic_tools/
site_description: Evidence-led multi-agent software development
repo_url: https://github.com/etibger/agentic_tools
repo_name: etibger/agentic_tools
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  font: false
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
  - pymdownx.details
extra_css:
  - stylesheets/extra.css
hooks:
  - scripts/docs_hooks.py
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    unrecognized_links: warn
nav:
  - Start here: index.md
  - Quick start: quick-start.md
  - Workflow:
      - Roles and communication: roles.md
      - Design and approval: design.md
      - Candidates and gates: gates.md
      - Verification and resources: verification.md
  - Dashboard and usage: dashboard.md
  - Retrospective and lessons: lessons.md
  - Download the templates: templates.md
  - Delivery and publication: reference.md
